<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="ARES Terminal Console">
  <title>ARES Terminal Console</title>
  <defs><linearGradient id="atWord" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#b14cff"/></linearGradient></defs>
  <svg x="20" y="20" width="260" height="260" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="atBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213a"/>
      <stop offset="1" stop-color="#070b15"/>
    </linearGradient>
    <linearGradient id="atAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#b14cff"/>
    </linearGradient>
    <linearGradient id="atFrame" gradientUnits="userSpaceOnUse" x1="72" y1="104" x2="440" y2="408">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#b14cff"/>
    </linearGradient>
    <radialGradient id="atGlow" cx=".3" cy=".3" r=".6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#atBg)"/>
  <rect width="512" height="512" rx="112" fill="url(#atGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#b14cff" stroke-opacity=".45" stroke-width="4"/>

  <!-- The console: one window, split into panes -->
  <rect x="72" y="104" width="368" height="304" rx="28" fill="#0b1322"/>
  <g stroke="url(#atFrame)" stroke-width="10" fill="none" stroke-linecap="round">
    <rect x="72" y="104" width="368" height="304" rx="28"/>
    <line x1="72" y1="150" x2="440" y2="150"/>
    <line x1="300" y1="150" x2="300" y2="408"/>
    <line x1="300" y1="279" x2="440" y2="279"/>
  </g>
  <circle cx="104" cy="127" r="8" fill="#22d3ee"/>
  <circle cx="130" cy="127" r="8" fill="#6a7fa6"/>
  <circle cx="156" cy="127" r="8" fill="#6a7fa6"/>

  <!-- The prompt -->
  <polyline points="118,224 172,268 118,312" fill="none" stroke="#eef3fb" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="298" width="76" height="22" rx="6" fill="url(#atAccent)"/>

  <!-- Other panes: a live session, and output arriving -->
  <g stroke-linecap="round" stroke-width="13">
    <line x1="328" y1="188" x2="408" y2="188" stroke="#2ee59d"/>
    <line x1="328" y1="215" x2="388" y2="215" stroke="#6a7fa6"/>
    <line x1="328" y1="242" x2="400" y2="242" stroke="#6a7fa6"/>
    <line x1="328" y1="316" x2="396" y2="316" stroke="#b14cff"/>
    <line x1="328" y1="343" x2="408" y2="343" stroke="#6a7fa6"/>
    <line x1="328" y1="370" x2="372" y2="370" stroke="#6a7fa6"/>
  </g>
  </svg>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="330" y="112" font-size="54" font-weight="700" letter-spacing="18" fill="#8ea3c7">ARES</text>
    <text x="326" y="200" font-size="92" font-weight="800" letter-spacing="1" fill="url(#atWord)">Terminal</text>
    <text x="330" y="258" font-size="50" font-weight="600" letter-spacing="3" fill="#eef3fb">Console</text>
  </g>
</svg>
